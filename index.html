<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game of the Week</title>
<meta name="theme-color" content="#0b0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game of the Week">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="shared/style.css">
<style>
  body { min-height: 100%; background: radial-gradient(120% 60% at 50% 0%, #17343a 0%, var(--bg) 60%); }
  main { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-top) + 28px) 16px calc(var(--safe-bottom) + 32px); }
  h1 { font-size: 34px; line-height: 1.05; margin: 0 0 6px; letter-spacing: -.5px; font-weight: 800; }
  h1 span { color: var(--gold); }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: 15px; }
  .games { display: grid; gap: 12px; }
  a.game {
    display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none;
  }
  a.game:active { transform: scale(.98); }
  .badge { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; flex: none;
    background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 30%, #000)); }
  .game b { display: block; font-size: 17px; margin-bottom: 2px; }
  .game small { color: var(--dim); font-size: 13px; line-height: 1.35; display: block; }
  .chev { margin-left: auto; color: var(--dim); font-size: 22px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Game of <span>the Week</span></h1>
  <p class="sub">Little games, made for fun.</p>
  <div class="games" id="games"></div>
  <footer>Everything saves on this phone. No accounts, no real money.</footer>
</main>
<script type="module">
  import { GAMES } from "./games.js";
  const list = document.getElementById("games");
  for (const g of [...GAMES].reverse()) {
    const a = document.createElement("a");
    a.className = "game"; a.href = `games/${g.id}/`; a.style.setProperty("--c", g.color);
    a.innerHTML = `<div class="badge">${g.emoji}</div><div><b></b><small></small></div><div class="chev">›</div>`;
    a.querySelector("b").textContent = g.name; a.querySelector("small").textContent = g.blurb;
    list.appendChild(a);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
